<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galleryy</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- =========================================
       VIDEO BACKGROUND (same looping clip)
  ========================================= -->
  <div class="video-bg-wrapper">
    <video id="bg-video" autoplay muted loop playsinline>
      <source src="assets/background/bg-loop.webm" type="video/webm" />
      <source src="assets/background/bg-loop.mp4"  type="video/mp4"  />
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- =========================================
       AMBIENT STAR PARTICLES
  ========================================= -->
  <div class="stars-layer" aria-hidden="true"></div>

  <!-- =========================================
       HEADER
  ========================================= -->
  <header class="site-header">
    <p class="site-subtitle">captured just for you</p>
    <h1 class="site-title">Moments of Celebration<span class="title-gem">✦</span></h1>
    <p class="site-hint">pop a bubble to see the photo</p>
  </header>

  <!-- =========================================
       BUBBLE SCENE — drive-script.js populates
  ========================================= -->
  <div id="bubble-scene" aria-label="Floating photo bubbles"></div>

  <!-- =========================================
       PHOTO MODAL
  ========================================= -->
  <div id="modal-backdrop" class="modal-backdrop" aria-modal="true" role="dialog" hidden>
    <div id="modal-card" class="modal-card modal-card--gallery">
      <button id="modal-close" class="modal-close" aria-label="Close photo">✕</button>

      <!-- Full-resolution photo -->
      <div class="modal-photo-wrap">
        <img id="modal-photo" class="modal-photo" src="" alt="" />
        <!-- Subtle shimmer shown while image loads -->
        <div class="modal-photo-shimmer" id="modal-shimmer"></div>
      </div>

      <!-- Caption -->
      <p id="modal-caption" class="modal-caption"></p>

      <div class="modal-footer-gem">✦</div>
    </div>
  </div>

  <!-- =========================================
       AUDIO
  ========================================= -->
  <audio id="bg-music" loop preload="auto">
    <source src="assets/music/theme.mp3" type="audio/mpeg" />
  </audio>

  <button id="music-toggle" class="music-toggle" aria-label="Toggle music" title="Toggle music">
    <span class="music-icon music-icon--on">♪</span>
    <span class="music-icon music-icon--off" hidden>♩</span>
  </button>

  <!-- =========================================
       BACK BUTTON — returns to index.html
  ========================================= -->
  <button id="back-btn" class="back-btn" aria-label="Go back home" title="Back to messages">
    ←
  </button>

  <script src="drive_script.js"></script>
</body>
</html>
